name: CI

# Frontend checks on every pull request and on pushes to dev/main. The backend tests stay local.
on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    # Same OS as the release build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Latest 22.x, not the runner's cached one: Electron 45 needs >= 22.12
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npx vitest run

      # Renderer bundle plus the Electron main and preload scripts
      - name: Build
        run: npm run build
