name: CI

# Frontend checks on every pull request, on pushes to dev/main, and before every release
# (release.yml calls this workflow, so a change here also gates releases). The backend tests stay local.
on:
  pull_request:
  push:
    branches:
      - dev
      - main
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress. When release.yml calls this,
# github.* is the caller's (workflow_dispatch or a tag push); event_name keeps a release's checks
# out of the group of push CI on the same branch, so neither cancels the other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    # Same OS as the release build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Latest 22.x, not the runner's cached one: Electron 45 needs >= 22.12
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: true
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npx vitest run

      # Renderer bundle plus the Electron main and preload scripts
      - name: Build
        run: npm run build
