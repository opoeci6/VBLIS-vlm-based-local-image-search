name: Release VBLIS

on:
  # Manual trigger via the GitHub web UI. With publish_release unchecked it's a build-only run:
  # the checks, the backend smoke test and the size check still run, and no release is created.
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag, e.g. v0.3.0'
        required: true
        type: string
      publish_release:
        description: 'Create a draft GitHub release (uncheck to only build artifacts)'
        required: true
        type: boolean
        default: true
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

  # Automatic trigger on Git tag push
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Rejects a bad tag or an existing release within a minute, before the long build starts
  prepare:
    runs-on: windows-latest
    permissions:
      # write, not read: draft releases are only listed to tokens with push access
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Validate Version Tag
        id: version
        env:
          # Passed via env, not expression syntax inside the script, so an input can't inject code
          VERSION_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.ref_name }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish_release }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:VERSION_TAG
          # -cnotmatch: -match ignores case. [0-9]: .NET's \d also matches non-ASCII digits
          if ($tag -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$') {
            Write-Output "::error::Version tag '$tag' must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          }
          Write-Output "Version $tag, publish: $env:PUBLISH"
          "version=$tag" >> $env:GITHUB_OUTPUT
          "publish=$env:PUBLISH" >> $env:GITHUB_OUTPUT

      - name: Refuse to Overwrite an Existing Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh needs to be told the repository
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          # A failing gh call (auth, network) stops the step instead of reading as "no release"
          $PSNativeCommandUseErrorActionPreference = $true
          # Lists drafts too: action-gh-release would reuse a draft and replace its assets
          $releases = gh release list --limit 1000 --json tagName --jq '.[].tagName'
          if ($releases -contains $env:TAG) {
            Write-Output "::error::A release for $env:TAG already exists (published or draft). This workflow never overwrites one; delete a stale draft by hand to rebuild."
            exit 1
          }
          # A tag push builds the tagged commit; a manual run builds its branch head, so with an
          # existing tag the assets could come from another commit than the tag points at
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $refs = gh api "repos/$env:GH_REPO/git/matching-refs/tags/$env:TAG" --jq '.[].ref'
            if ($refs -ccontains "refs/tags/$env:TAG") {
              Write-Output "::error::Tag $env:TAG already exists. Release it from its tag-push run (re-run that run), not from a manual run."
              exit 1
            }
          }
          Write-Output "No release and no conflicting tag for $env:TAG"

  # Lint, unit tests and the vite build: the CI workflow itself, on this same commit
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-release:
    needs: [prepare, checks]
    runs-on: windows-latest
    permissions:
      contents: write   # creates the draft release
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Sync app/package.json Version
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          # v0.3.0 -> 0.3.0
          npm --prefix app version ($env:VERSION -replace '^v', '') --no-git-tag-version --allow-same-version

      # The version the backend is developed and tested on
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            api/requirements.txt
            api/constraints.txt

      # Latest 22.x, not the runner's cached one: Electron 45 needs >= 22.12
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: true
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      # Every package is pinned by api/constraints.txt (pip freeze of the tested dev venv). The
      # torch==2.6.0+cu124 pin takes the CUDA wheel from the cu124 index that requirements.txt adds.
      - name: Install Python Dependencies (CUDA 12.4 PyTorch) & PyInstaller
        working-directory: api
        run: |
          $ErrorActionPreference = "Stop"
          # Otherwise a failing pip doesn't stop the script: the step only sees the last exit code
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller -c constraints.txt

      # pip has no strict mode for constraints: a dependency missing from constraints.txt would
      # install unpinned without a word
      - name: Check That Every Installed Python Package Is Pinned
        working-directory: api
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip check
          # Normalize names (case, - _ .): pip versions print them differently
          $normalize = { $n, $v = $_ -split '==', 2; ($n -replace '[-_.]+', '-').ToLowerInvariant() + "==$v" }
          $pinned = Get-Content constraints.txt | Where-Object { $_ -match '==' -and $_ -notmatch '^\s*#' } | ForEach-Object $normalize
          $unpinned = python -m pip freeze | ForEach-Object $normalize | Where-Object { $_ -notin $pinned }
          if ($unpinned) {
            Write-Output "::error::Installed without a pin in api/constraints.txt: $($unpinned -join ', ')"
            exit 1
          }
          Write-Output "Every installed package is pinned"

      - name: Build Python Backend with PyInstaller
        working-directory: api
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m PyInstaller api.spec -y

      # Before packaging: start api.exe like the app does and check that it answers (runs locally too)
      - name: Smoke-Test the Frozen Backend
        timeout-minutes: 10
        run: ./.github/scripts/smoke-test-backend.ps1 -ExePath api/dist/api/api.exe

      - name: Install Node Dependencies
        working-directory: app
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci

      - name: Build React Frontend & Package Electron App
        working-directory: app
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          npm run build
          npx electron-builder build --windows --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub release assets must be under 2 GiB each (v0.2.0: installer 1,852 MiB, 7z 1,554 MiB)
      - name: Check Asset Sizes & Write SHA256SUMS.txt
        working-directory: app/dist-built
        run: |
          $ErrorActionPreference = "Stop"
          $assets = @(Get-ChildItem -File | Where-Object Extension -in ".exe", ".7z" | Sort-Object Name)
          foreach ($ext in ".exe", ".7z") {
            $count = @($assets | Where-Object Extension -eq $ext).Count
            if ($count -ne 1) { Write-Output "::error::Expected one $ext in app/dist-built, found $count"; exit 1 }
          }
          $tooBig = $false
          foreach ($a in $assets) {
            $size = "{0:N0} MiB" -f ($a.Length / 1MB)
            Write-Output ("{0,-40} {1,10}" -f $a.Name, $size)
            if ($a.Length -ge 2GB) {
              Write-Output "::error::$($a.Name) is $size; GitHub release assets must be under 2 GiB (2,048 MiB)"
              $tooBig = $true
            } elseif ($a.Length -gt 1.9GB) {
              Write-Output "::warning::$($a.Name) is $size, close to GitHub's 2 GiB limit for release assets"
            }
          }
          if ($tooBig) { exit 1 }
          # sha256sum format (lowercase hash, two spaces, name; LF, no BOM), so sha256sum -c reads it
          $lines = foreach ($a in $assets) {
            "{0}  {1}" -f (Get-FileHash $a.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $a.Name
          }
          # Full path: .NET's current directory is not the step's working directory
          [IO.File]::WriteAllText((Join-Path $PWD "SHA256SUMS.txt"), ($lines -join "`n") + "`n")
          Get-Content SHA256SUMS.txt

      - name: Upload Installer (.exe)
        uses: actions/upload-artifact@v7
        with:
          name: VBLIS-Installer-${{ env.VERSION }}
          path: |
            app/dist-built/*.exe
            app/dist-built/SHA256SUMS.txt
          retention-days: 30

      - name: Upload Portable Archive (.7z)
        uses: actions/upload-artifact@v7
        with:
          name: VBLIS-Portable-${{ env.VERSION }}
          path: |
            app/dist-built/*.7z
            app/dist-built/SHA256SUMS.txt
          retention-days: 30

      - name: Create Draft GitHub Release
        if: needs.prepare.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          # Where a manual run's tag is created when you publish the draft: the commit built here,
          # not the default branch's head by then. Ignored when the tag already exists (tag push).
          target_commitish: ${{ github.sha }}
          name: Release ${{ env.VERSION }}
          # Review the notes and assets, then publish by hand
          draft: true
          prerelease: ${{ inputs.prerelease == true }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            app/dist-built/*.exe
            app/dist-built/*.7z
            app/dist-built/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
